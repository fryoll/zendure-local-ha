name: Beta Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version to publish (example: 1.3.0b1)"
        required: true

permissions:
  contents: write

jobs:
  publish-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate beta version format
        env:
          BETA_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$BETA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then
            echo "Version must look like 1.3.0b1"
            exit 1
          fi

      - name: Update manifest version for beta artifact
        env:
          BETA_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/zendure_local/manifest.json")
          data = json.loads(path.read_text())
          data["version"] = os.environ["BETA_VERSION"]
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Create HACS beta release zip
        run: |
          mkdir -p dist
          zip -r dist/zendure_local.zip custom_components/zendure_local/ -x '*/__pycache__/*' '*.pyc' '*.pyo'

      - name: Create Git tag for beta
        env:
          BETA_TAG: v${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$BETA_TAG"
          git push origin "$BETA_TAG"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          prerelease: true
          generate_release_notes: true
          name: v${{ inputs.version }}
          files: dist/zendure_local.zip
